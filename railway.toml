[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "gunicorn -c gunicorn.conf.py 'app:create_app()'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Volume is configured via Railway Dashboard → Storage → tip-app-volume
# Mount path: /app/backend/data/state
# Also set DATA_MOUNT_PATH=/app/backend/data/state in Railway environment variables.
