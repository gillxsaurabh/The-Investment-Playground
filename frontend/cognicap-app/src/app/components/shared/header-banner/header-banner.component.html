<!-- Sidebar (fixed left) -->
<app-sidebar
  [userName]="userName"
  [brokerLinked]="brokerLinked"
  (onLogout)="logout()">
</app-sidebar>

<!-- Slim top bar (fixed, offset by sidebar via CSS var) -->
<header class="top-bar">
  <div class="top-bar-left">
    <svg viewBox="0 0 340 60" xmlns="http://www.w3.org/2000/svg" width="108" height="19" aria-label="StockCraft" style="display:block;flex-shrink:0;">
      <text x="10" y="48" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="42px" font-weight="300" fill="#ffffff">Stock<tspan font-weight="600" fill="#F59E0B">Craft</tspan></text>
    </svg>
    <span class="platform-tagline">Portfolio Intelligence</span>
  </div>
  <div class="top-bar-right">
    <div class="broker-chip" [class.linked]="brokerLinked"
         [title]="brokerLinked ? 'Kite linked — live data' : 'Demo mode'">
      <span class="broker-dot"></span>
      <span class="broker-text">{{ brokerLinked ? 'Live' : 'Demo' }}</span>
    </div>
    <span class="user-chip" *ngIf="userName" (click)="navigateTo('account')" title="Account settings">
      <span class="material-icons">person</span>
      {{ userName }}
    </span>
    <button class="logout-btn" (click)="logout()" title="Logout">
      <span class="material-icons">logout</span>
    </button>
  </div>
</header>

<!-- Market ticker (compact, fixed below top bar) -->
<div class="ticker-row">
  <app-market-banner
    [nifty]="nifty"
    [sensex]="sensex"
    [marketGainers]="marketGainers"
    [marketLosers]="marketLosers"
    [isLoading]="isMarketLoading"
    [error]="marketError">
  </app-market-banner>
</div>
