<div class="login-container">

  <div class="login-card">

    <!-- Logo / Brand -->
    <div class="header">
      <svg viewBox="0 0 420 96" xmlns="http://www.w3.org/2000/svg" width="280" height="64" aria-label="StockCraft" style="display:block;margin:0 auto;">
        <text x="210" y="60" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="68px" font-weight="300" fill="#ffffff" text-anchor="middle">Stock<tspan font-weight="600" fill="#F59E0B">Craft</tspan></text>
        <text x="210" y="84" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10px" font-weight="400" letter-spacing="5px" fill="#F59E0B" opacity="0.7" text-anchor="middle">INTELLIGENT INVESTING</text>
      </svg>
    </div>

    <!-- Tab switcher (login/signup only, not forgot) -->
    <div class="tab-switcher" *ngIf="mode !== 'forgot'">
      <button class="tab" [class.active]="mode === 'login'" (click)="switchMode('login')">Sign In</button>
      <button class="tab" [class.active]="mode === 'signup'" (click)="switchMode('signup')">Sign Up</button>
    </div>

    <!-- Forgot password header -->
    <div class="forgot-header" *ngIf="mode === 'forgot'">
      <h2>Reset Password</h2>
      <p class="forgot-sub">Enter your email and we'll send you a reset link.</p>
    </div>

    <div class="login-content">

      <!-- Sign Up: Name field -->
      <div class="form-group" *ngIf="mode === 'signup'">
        <label for="name">
          <span class="material-icons">person</span>
          Name
        </label>
        <input type="text" id="name" [(ngModel)]="name" placeholder="Your name" [disabled]="isLoading" autocomplete="name">
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">
          <span class="material-icons">email</span>
          Email
        </label>
        <input type="email" id="email" [(ngModel)]="email" placeholder="you@example.com"
          [disabled]="isLoading" autocomplete="email"
          (keyup.enter)="mode === 'login' ? onSubmit() : null">
      </div>

      <!-- Password (login and signup only) -->
      <div class="form-group" *ngIf="mode !== 'forgot'">
        <label for="password">
          <span class="material-icons">lock</span>
          Password
        </label>
        <input type="password" id="password" [(ngModel)]="password" placeholder="Enter password"
          [disabled]="isLoading" autocomplete="current-password"
          (keyup.enter)="mode === 'login' ? onSubmit() : null">
      </div>

      <!-- Confirm password (signup only) -->
      <div class="form-group" *ngIf="mode === 'signup'">
        <label for="confirmPassword">
          <span class="material-icons">lock</span>
          Confirm Password
        </label>
        <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" placeholder="Confirm password"
          [disabled]="isLoading" autocomplete="new-password" (keyup.enter)="onSubmit()">
      </div>

      <!-- Forgot password link (login mode only) -->
      <div class="forgot-link" *ngIf="mode === 'login'">
        <a (click)="switchMode('forgot')">Forgot password?</a>
      </div>

      <!-- Submit button -->
      <button class="btn btn-primary" (click)="onSubmit()" [disabled]="isLoading">
        <span class="material-icons" *ngIf="!isLoading">
          {{ mode === 'login' ? 'login' : mode === 'signup' ? 'person_add' : 'send' }}
        </span>
        <span class="material-icons spin-icon" *ngIf="isLoading">refresh</span>
        <span *ngIf="mode === 'login'">{{ isLoading ? 'Signing in...' : 'Sign In' }}</span>
        <span *ngIf="mode === 'signup'">{{ isLoading ? 'Creating account...' : 'Create Account' }}</span>
        <span *ngIf="mode === 'forgot'">{{ isLoading ? 'Sending...' : 'Send Reset Link' }}</span>
      </button>

      <!-- Success message -->
      <div class="success-box" *ngIf="successMessage">
        <span class="material-icons">check_circle</span>
        <span>{{ successMessage }}</span>
      </div>

      <!-- Error message -->
      <div class="error-box" *ngIf="error">
        <span class="material-icons">error_outline</span>
        <span>{{ error }}</span>
      </div>

      <!-- Switch prompt (login/signup) -->
      <div class="switch-prompt" *ngIf="mode !== 'forgot'">
        <span *ngIf="mode === 'login'">
          Don't have an account?
          <a (click)="switchMode('signup')">Sign up</a>
        </span>
        <span *ngIf="mode === 'signup'">
          Already have an account?
          <a (click)="switchMode('login')">Sign in</a>
        </span>
      </div>

      <!-- Back to login (forgot mode) -->
      <div class="switch-prompt" *ngIf="mode === 'forgot'">
        <a (click)="switchMode('login')">
          <span class="material-icons" style="font-size:13px;vertical-align:middle;">arrow_back</span>
          Back to Sign In
        </a>
      </div>

    </div>

    <div class="footer">
      <span class="material-icons footer-icon">security</span>
      <small>Your data is encrypted and secure</small>
    </div>
  </div>
</div>
